; PlatformIO project configuration
; Board: Elecrow CrowPanel ESP32 HMI 5.0" (module DIS07050H)
; MCU:   ESP32-S3-WROOM-1-N4R8 (4 MB flash, 8 MB PSRAM)
; See README.md for the full hardware + pin reference.

[platformio]
default_envs = crowpanel-50
src_dir = src

[env:crowpanel-50]
; pioarduino fork = Arduino-ESP32 3.3.11 / ESP-IDF 5.5.5 (the official PlatformIO
; espressif32 platform is stuck on core 2.x / IDF 4.4). Core 3.x is required for the
; modern esp_lcd RGB driver (num_fbs>=2 + bounce buffer) that fixes the panel flicker.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; --- ESP32-S3-WROOM-1-N4R8: 4 MB flash + 8 MB Octal PSRAM ---
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_opi
; 3 MB app partition (no OTA) leaves room for the LVGL UI + web assets on 4 MB flash.
board_build.partitions = huge_app.csv

build_flags =
    ; --- PSRAM (required for the 800x480 LVGL framebuffers) ---
    -D BOARD_HAS_PSRAM
    ; --- Console on UART0 (CH340 bridge / COM port). The ESP32-S3 native USB
    ;     peripheral is hard-wired to GPIO19/20, but this board uses those pins
    ;     for the I2C bus (SDA=19, SCL=20 -> GT911 touch, PCA9557). So USB-CDC
    ;     can never work here; Serial MUST go to UART0 or all logs are lost. ---
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ; --- LVGL: use our src/lv_conf.h ---
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -D CORE_DEBUG_LEVEL=3

lib_deps =
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@^6.21.5
    mathieucarbou/ESPAsyncWebServer@^3.3.12
    ricmoo/QRCode@^0.0.1
    bitbank2/JPEGDEC@^1.6.0
